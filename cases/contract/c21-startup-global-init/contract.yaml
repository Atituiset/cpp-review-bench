contract:
  name: startup_global_init
  summary: 全局缓冲 g_buf 在 startup 阶段 gbuf_init 分配，业务路径直接使用
  guarantees:
    - id: g1
      statement: 契约保证 gbuf_init 在任意 gbuf_write_at 之前调用，g_buf 一旦进入业务期恒非空
  assumptions:
    - id: a1
      statement: 运行期 init 先于 use，全局量生命周期跨函数受控
  exemptions:
    - scenario: cwe-476
      file: src/global.c
      anchor: "g_buf[end] = 0xFF;"
      because: 见 g1——init 契约保证非空，非 cwe-476
