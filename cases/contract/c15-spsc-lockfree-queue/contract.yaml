contract:
  name: spsc_lockfree_queue
  summary: 单生产者单消费者无锁环形队列，head/tail 各自由一方维护
  guarantees:
    - id: g1
      statement: SPSC 语义下 g_head 仅消费者写、g_tail 仅生产者写，均为 _Atomic 且以 acquire/release 成对同步，无数据竞争，无需互斥锁
  assumptions:
    - id: a1
      statement: 生产者和消费者各为单一线程
  exemptions:
    - scenario: cwe-362
      file: src/spsc.c
      anchor: "*out = g_q[head % QSZ];"
      because: 见 g1——共享指针均为原子量且内存序正确，无竞争，非 cwe-362
