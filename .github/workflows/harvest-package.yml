name: harvest-package
# 候选打包 + inbox 三态流转辅助
# 与 harvest.yml 的 vote job 衔接；本 workflow 聚焦「inbox 草稿 → 三态确认」的人工辅助：
#   - list：列出当前 draft 候选
#   - confirm-tp <ids>：转 cases/defect/（真 bug）
#   - contract <ids>：   转 cases/contract/（确认是 FP 契约，contract.yaml 必填）
#   - reject <ids>：      转 harvest/inbox/rejected/（带原因）
# case_ids 支持空格分隔的多个 id（方案 A 细粒度：30 接受 10 拒绝 一次传多个 id）。
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [list, confirm-tp, contract, reject]
        default: list
      case_ids:
        type: string
        description: "空格分隔的候选 id 列表，如 auto-curl-03fd447a33 auto-curl-09f32064f8"
        required: false
      reason:
        type: string
        required: false

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 列出 draft 候选
        if: inputs.action == 'list'
        run: |
          echo "=== 待审核候选（harvest/inbox/draft）==="
          ls -1 harvest/inbox/draft 2>/dev/null || echo "（空）"
      - name: confirm-tp → cases/defect/
        if: inputs.action == 'confirm-tp'
        env:
          GH_TOKEN: ${{ secrets.HARVEST_TOKEN || secrets.GITHUB_TOKEN }}
          # dispatch 输入经 env 传入，绝不 ${{ }} 插值进 run（防 shell 注入）
          CASE_IDS: ${{ inputs.case_ids }}
        run: |
          for cid in $CASE_IDS; do
            # id 用于路径拼接前校验字符集（防路径穿越）
            [[ "$cid" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::非法候选 id：$cid"; exit 1; }
            SRC="harvest/inbox/draft/$cid"
            [ -d "$SRC" ] || { echo "SKIP 无 $SRC"; continue; }
            mkdir -p "cases/defect/$cid"
            git mv "$SRC"/* "cases/defect/$cid/"
            echo "已转 cases/defect/$cid"
          done
          git -c user.name='harvest-bot' -c user.email='harvest@users.noreply.github.com' \
            commit -m "feat(defect): confirm-tp $CASE_IDS（harvest 自动入库）" || echo "无改动"
      - name: contract → cases/contract/
        if: inputs.action == 'contract'
        env:
          GH_TOKEN: ${{ secrets.HARVEST_TOKEN || secrets.GITHUB_TOKEN }}
          CASE_IDS: ${{ inputs.case_ids }}
        run: |
          for cid in $CASE_IDS; do
            [[ "$cid" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::非法候选 id：$cid"; exit 1; }
            SRC="harvest/inbox/draft/$cid"
            [ -d "$SRC" ] || { echo "SKIP 无 $SRC"; continue; }
            [ -s "$SRC/contract.yaml" ] || { echo "ERROR: $cid contract.yaml 必填（FP 因何契约成立）"; exit 1; }
            mkdir -p "cases/contract/$cid"
            git mv "$SRC"/* "cases/contract/$cid/"
            echo "已转 cases/contract/$cid"
          done
          git -c user.name='harvest-bot' -c user.email='harvest@users.noreply.github.com' \
            commit -m "feat(contract): contract $CASE_IDS（真实 FP 契约入库）" || echo "无改动"
      - name: reject → inbox/rejected/
        if: inputs.action == 'reject'
        env:
          GH_TOKEN: ${{ secrets.HARVEST_TOKEN || secrets.GITHUB_TOKEN }}
          CASE_IDS: ${{ inputs.case_ids }}
          REASON: ${{ inputs.reason }}
        run: |
          for cid in $CASE_IDS; do
            [[ "$cid" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::非法候选 id：$cid"; exit 1; }
            SRC="harvest/inbox/draft/$cid"
            [ -d "$SRC" ] || { echo "SKIP 无 $SRC"; continue; }
            mkdir -p "harvest/inbox/rejected/$cid"
            git mv "$SRC"/* "harvest/inbox/rejected/$cid/"
            printf '%s\n' "$REASON" > "harvest/inbox/rejected/$cid/REJECT_REASON.md"
            echo "已驳回 → harvest/inbox/rejected/$cid"
          done
          git -c user.name='harvest-bot' -c user.email='harvest@users.noreply.github.com' \
            commit -m "chore(reject): $CASE_IDS —— $REASON" || echo "无改动"
