# LLM/Agent 评审评测（design-v0.4 消费形态之一：Agent+LLM 评审）
# 流程：选例 → tools/llm_review.py 逐例评审（contract 轨注入 contract.yaml）→
#       归一化 findings（schema/findings.schema.json）→ tools/eval.py run 评分 →
#       汇总进 Step Summary + artifact 归档（findings + eval 结果 + 模型版本）
# API key 经仓库 secret AI_REVIEW_API_KEY 注入；base-url/model 可在 dispatch 时改，
# 兼容任意 OpenAI 兼容端点（DeepSeek/Kimi/OpenRouter/...）。

name: llm-eval

on:
  workflow_dispatch:
    inputs:
      cases:
        description: 逗号分隔 case id（冒烟默认 c01/c08 contract + r04/r10 defect）
        required: true
        default: c01-upstream-nullguard,c08-protocol-offset-parse,r04-oob-write-stack,r10-odd-length-bcd
      model:
        description: 被测模型名
        required: true
        default: deepseek-chat
      base_url:
        description: OpenAI 兼容端点
        required: true
        default: https://api.deepseek.com

permissions:
  contents: read
  security-events: write   # upload-sarif 需要（评审结果进 Code scanning）

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # eval.py run 的 findings schema 校验依赖 jsonschema
      - name: 安装 python 依赖
        run: pip install jsonschema

      - name: LLM 逐例评审 → 归一化 findings
        env:
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_BASE_URL: ${{ inputs.base_url }}
          AI_REVIEW_MODEL: ${{ inputs.model }}
          # dispatch 输入经 env 传入，绝不 ${{ }} 插值进 run（防 shell 注入）
          CASES: ${{ inputs.cases }}
        run: |
          mkdir -p /tmp/llm-findings
          python3 tools/llm_review.py \
            --cases "$CASES" \
            --out /tmp/llm-findings 2>&1 | tee /tmp/review.log

      - name: eval.py 评分
        if: always()   # 部分例评审失败也要对已有 findings 出分
        run: |
          python3 tools/eval.py run /tmp/llm-findings > /tmp/eval-result.json
          python3 - <<'PYEOF'
          import json
          d = json.load(open('/tmp/eval-result.json'))
          print('=== per-case 四态 ===')
          for c in d['cases']:
              print(f"{c['state']:>6}  {c['track']}/{c['case_id']}  "
                    f"hit={c['must_find_hit']}/{c['must_find_total']} "
                    f"viol={c['must_not_violated']} extra={c['extra']}")
          print()
          print(json.dumps(d['summary'], ensure_ascii=False, indent=2))
          PYEOF

      - name: 汇总入 Step Summary
        if: always()
        env:
          IN_MODEL: ${{ inputs.model }}
          IN_BASE_URL: ${{ inputs.base_url }}
          IN_CASES: ${{ inputs.cases }}
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" "$IN_MODEL" "$IN_BASE_URL" "$IN_CASES" <<'PYEOF' || echo "summary 生成失败（不阻塞）"
          import json, sys
          summary_file, model, base_url, cases = sys.argv[1:5]
          d = json.load(open('/tmp/eval-result.json'))
          rows = ['# LLM 评审评测（llm-eval）', '',
                  f'- 模型：`{model}`（`{base_url}`）',
                  f'- 用例：{cases}', '',
                  '| 用例 | 轨 | 四态 | must_find 命中 | must_not 违反 | EXTRA |',
                  '|---|---|---|---|---|---|']
          for c in d['cases']:
              rows.append(f"| {c['case_id']} | {c['track']} | **{c['state']}** | "
                          f"{c['must_find_hit']}/{c['must_find_total']} | "
                          f"{c['must_not_violated']} | {c['extra']} |")
          for track, s in d['summary'].items():
              rows += ['', f"**{track} 轨**：{s['cases']} 例，pass {s['pass']}，"
                           f"recall {s['recall']:.0%}，契约违反 {s['contract_violations']}，"
                           f"裸 FP {s['bare_fp']}，severity 正确率 {s['severity_accuracy']:.0%}"]
          open(summary_file, 'a').write('\n'.join(rows) + '\n')
          PYEOF

      - name: findings → SARIF（映射到 cases/<track>/<id>/ 真实路径）
        if: always()
        run: |
          python3 sa/adapters/findings_to_sarif.py \
            --dir /tmp/llm-findings /tmp/llm-eval.sarif

      - name: 上传 SARIF 到 Code scanning（仓库 Security → Code scanning 可视化告警）
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/llm-eval.sarif
          category: llm-eval

      - name: 归档 findings 与评测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-eval-${{ github.run_id }}
          path: |
            /tmp/llm-findings/
            /tmp/eval-result.json
            /tmp/review.log
            /tmp/llm-eval.sarif
          if-no-files-found: ignore
