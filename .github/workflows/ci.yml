name: bench-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-eval:
    runs-on: ubuntu-latest
    # 强制 UTF-8 流编码：CI runner 默认 LANG=C，Python 往 stderr/stdout 写中文会触发
    # UnicodeEncodeError -> runner 流处理放大成 RecursionError 使步骤崩溃。
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: 安装 clang-21 全套（含 clang-extdef-mapping，供原生 CTU）
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update -q
          sudo apt-get install -y clang-21 clang-tools-21
          # 让脚本默认找到 clang-21 / clang-extdef-mapping-21
          echo "CLANG_BIN=clang-21" >> "$GITHUB_ENV"
          echo "EXTDEF_BIN=clang-extdef-mapping-21" >> "$GITHUB_ENV"
          # 探测 clang-tidy 真实位置并建可预测名
          echo "=== 探测 clang-tidy ==="
          which clang-tidy clang-tidy-21 2>/dev/null || true
          ls -la /usr/lib/llvm-21/bin/ 2>/dev/null | grep -i tidy || true
          dpkg -L clang-tools-21 2>/dev/null | grep -i tidy || true
          TIDY=$(command -v clang-tidy || command -v clang-tidy-21 || ls /usr/lib/llvm-21/bin/clang-tidy 2>/dev/null || true)
          if [ -n "$TIDY" ] && [ -x "$TIDY" ]; then
            sudo ln -sf "$TIDY" /usr/bin/clang-tidy-21
            echo "linked $TIDY -> /usr/bin/clang-tidy-21"
          fi
          clang-21 --version | head -1
          echo "clang-tidy-21: $(command -v clang-tidy-21 || echo MISSING)"

      - name: 安装 cppcheck（第二个对照工具，apt 直装）
        # 版本说明（2026-09-03 查证）：apt 无法钉具体版本（ubuntu 源只留当前版），
        # 版本随 ubuntu-latest（当前 24.04，cppcheck 2.13.x）漂移；
        # 故显式把 runner 系统版本与 cppcheck 版本落日志，保证 findings.version 可追溯。
        run: |
          sudo apt-get install -y cppcheck
          echo "CPPCHECK_BIN=cppcheck" >> "$GITHUB_ENV"
          lsb_release -a 2>/dev/null | grep -E 'Description|Release'
          dpkg -l cppcheck | tail -1
          cppcheck --version

      - name: 全量编译 + 统一 compile_commands.json
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON
          python3 -c "import json;print('compdb entries:', len(json.load(open('build/compile_commands.json'))))"

      - name: 用例自检（schema + anchor 真实存在）
        run: python3 tools/check_cases.py

      - name: 评测器自检（构造 findings 1FP+1FN+1契约违反）
        run: python3 tools/eval.py selftest

      - name: evidence 归档 findings schema 校验（reports/evidence/**/*.json）
        run: python3 tools/check_evidence.py

      - name: CSA 单 TU 默认配置
        run: ./sa/runners/run_csa.sh singletu /tmp/csa_singletu

      - name: CSA 原生 CTU（跨文件分析）
        run: ./sa/runners/run_csa.sh ctu /tmp/csa_ctu

      - name: 检查 CSA CTU 退化标记（runner 落 DEGRADED 即转 GitHub warning 明示）
        run: |
          if [ -f /tmp/csa_ctu/DEGRADED ]; then
            echo "::warning title=CSA CTU 退化::CTU 已退化为单 TU：$(cat /tmp/csa_ctu/DEGRADED)"
          fi

      - name: CppCheck（跨工具对照）
        run: ./sa/runners/run_cppcheck.sh /tmp/cppcheck

      - name: clang-tidy（编译期检查，clang-21 自带，第三个对照工具）
        env:
          CLANG_TIDY_BIN: clang-tidy-21
        run: ./sa/runners/run_clang_tidy.sh /tmp/clang-tidy

      - name: 汇总全部工具 findings 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-findings
          path: |
            /tmp/csa_singletu/*.json
            /tmp/csa_ctu/*.json
            /tmp/cppcheck/*.json
            /tmp/clang-tidy/*.json

  infer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Infer（官方预编译二进制，抽象解释代表工具）
        uses: srz-zumix/setup-infer@v1

      - name: 全量编译 + 统一 compile_commands.json
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON
          infer --version | head -1

      - name: 逐 case 跑 Infer（抽象解释）+ 归一化
        run: |
          ./sa/runners/run_infer.sh "$PWD/cases" "$PWD/infer-findings" "$PWD"
          echo "=== 各例 Infer findings 数 ==="
          for f in infer-findings/*.json; do echo "$(basename $f): $(python3 -c "import json;print(len(json.load(open('$f'))['findings']))" 2>/dev/null)"; done

      - name: Infer 四态评测（vs golden）
        run: python3 tools/eval.py run infer-findings 2>&1 | tail -40

      - name: 汇总 Infer 产物上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: infer-findings
          path: |
            infer-findings/*.json

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: 初始化 CodeQL（c-cpp，默认 CWE 查询套件）
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-and-quality

      - name: 构建数据库（cmake 全量编译）
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON && cmake --build build -j "$(nproc)"

      - name: 运行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results.sarif
          upload: false

      - name: 转换 SARIF → 归一化 findings 并四态评测
        run: |
          SARIF=$(find . -path '*codeql-results*' -name 'cpp.sarif' -type f 2>/dev/null | head -1)
          [ -z "$SARIF" ] && SARIF=$(find . -name '*.sarif' -type f 2>/dev/null | head -1)
          echo "SARIF=$SARIF"
          python3 sa/adapters/sarif_to_findings.py "$SARIF" codeql-findings --tool codeql --repo-root "$PWD" 2>&1 | tail -5
          ls codeql-findings/*.json 2>/dev/null | wc -l
          python3 tools/eval.py run codeql-findings 2>&1 | tail -30

      - name: 汇总 CodeQL 产物上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-findings
          path: |
            codeql-findings/*.json
            codeql-results.sarif

  klee:
    runs-on: ubuntu-latest
    container:
      # 版本钉死（2026-09-03 查证 Docker Hub klee/klee tags）：
      # v3.2 为最新 release tag（2025-12-23 发布，当前 latest 与 v3.2 同镜像），
      # 不再用浮动的 latest。tag 列表：https://hub.docker.com/v2/repositories/klee/klee/tags
      image: klee/klee:v3.2
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: 全量编译 + 统一 compile_commands.json（部分 case 的 harness 依赖）
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON
      - name: 逐 case 跑 KLEE（符号执行）+ 归一化
        run: |
          ./sa/runners/run_klee.sh "$PWD/cases" "$PWD/klee-findings" "$PWD"
          echo "=== 各例 KLEE findings 数 ==="
          for f in klee-findings/*.json; do [ -f "$f" ] && echo "$(basename $f): $(python3 -c "import json;print(len(json.load(open('$f'))['findings']))" 2>/dev/null)"; done
      # eval.py run 仅在 findings 不合 schema / 评测器自身崩溃时非零；
      # FN/FP 等评测结果差仍是 exit 0，故不再 || 兜底——工具坏了要让 job 变红
      - name: KLEE 四态评测（vs golden）
        run: python3 tools/eval.py run klee-findings 2>&1 | tail -30
      - name: 汇总 KLEE 产物上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: klee-findings
          path: |
            klee-findings/*.json

  codechecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 clang + CodeChecker（pip，含 clang SA 与 clang-tidy）
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang clang-tidy
          # 版本钉死（2026-09-03 查证）：PyPI 最新 codechecker 6.28.3
          # （https://pypi.org/project/codechecker/ ，对应 GitHub release v6.28.3）
          pip3 install --no-cache-dir codechecker==6.28.3
          echo "CodeChecker: $(CodeChecker --version 2>/dev/null | head -1)"
      - name: 全量编译 + 统一 compile_commands.json
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON
      - name: CodeChecker analyze（clang SA + clang-tidy，CTU）
        # analyze 失败（工具坏）不再 || true 吞掉，让步骤变红；
        # parse/导出无结果属「该例就是没有输出」的合法容忍，保留 warn 兜底
        run: |
          CodeChecker analyze build/compile_commands.json --ctu --output cc_reports 2>&1 | tail -5
          CodeChecker parse cc_reports -e json > cc_export.json 2>/dev/null || echo "[warn] parse 无结果（零 findings 属合法）"
          echo "=== cc_export.json reports 数 ==="
          python3 -c "import json;d=json.load(open('cc_export.json'));print('reports:',len(d.get('reports',[])))" 2>/dev/null || echo "0"
      - name: 归一化 + 四态评测
        run: |
          if [ -f cc_export.json ]; then
            python3 sa/adapters/codechecker_to_findings.py cc_export.json "$PWD/cases" --out-dir cc-findings --version "$(CodeChecker --version 2>/dev/null | head -1)" 2>&1 | tail -20
            python3 tools/eval.py run cc-findings 2>&1 | tail -30
          else
            echo "[warn] cc_export.json 不存在，跳过归一化"
          fi
      - name: 汇总 CodeChecker 产物上传 artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codechecker-findings
          path: |
            cc-findings/*.json

  joern:
    runs-on: ubuntu-latest
    container:
      # 版本钉死（2026-09-03 查证）：GHCR 上 joern 只有 master/nightly 两个滚动 tag，
      # 无版本 tag（https://ghcr.io/v2/joernio/joern/tags/list），故按 digest 钉死。
      # 该 digest 镜像构建于 2026-09-02，对应 release v4.0.616
      # （https://github.com/joernio/joern/releases）；升级需人工更新 digest。
      image: ghcr.io/joernio/joern:master@sha256:6ba92a353007650d1dc768d8a4d29653739093bdb679ac07d82dec33b4cdc0f8
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: 逐 case 跑 Joern（CPG 通用查询：危险调用枚举，不读 golden）+ 归一化
        run: |
          ./sa/runners/run_joern.sh "$PWD/cases" "$PWD/joern-findings" "$PWD"
          echo "=== 各例 Joern findings 数 ==="
          for f in joern-findings/*.json; do [ -f "$f" ] && echo "$(basename $f): $(python3 -c "import json;d=json.load(open('$f'));print(len(d.get('findings',[])))" 2>/dev/null)"; done
      # eval.py run 仅在 findings 不合 schema / 评测器自身崩溃时非零；
      # FN/FP 等评测结果差仍是 exit 0，故不再 || 兜底——工具坏了要让 job 变红
      - name: Joern 四态评测（vs golden）
        run: python3 tools/eval.py run joern-findings 2>&1 | tail -30
      - name: 汇总 Joern 产物上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: joern-findings
          path: |
            joern-findings/*.json

  cooddy-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # 拉 GHCR 预建镜像
    steps:
      - uses: actions/checkout@v4
      - name: 拉取 GHCR 预建 cooddy 镜像（build-cooddy-image 工作流发布；拉不到回退本地 build）
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/cooddy:latest
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if docker pull "$IMAGE"; then
            docker tag "$IMAGE" cooddy-test:ci
          else
            echo "[warn] GHCR 无预建镜像（先跑一次 build-cooddy-image 工作流发布），回退本地 build（约 40 分钟）"
            docker build -f sa/docker/cooddy/Dockerfile -t cooddy-test:ci . 2>&1 | tee /tmp/cooddy_build.log | tail -3
            echo "=== 真实报错（make 阶段）==="
            grep -iE 'error:|cannot find|cannot be used|libz3|z3' /tmp/cooddy_build.log | tail -30
          fi
      - name: 生成 compdb 并跑 cooddy 验证端到端
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON
          # ENTRYPOINT 指向的是目录，用 bash 定位真正的 cooddy 二进制再跑
          docker run --rm --entrypoint bash -v "$PWD":/workspace cooddy-test:ci -c "\
            COODDY=\$(find /opt/cooddy/build -name cooddy -type f | head -1); \
            echo \"coooddy bin: \$COODDY\"; \
            \$COODDY --scope /workspace/cases/defect/r04-oob-write-stack --reporter json" \
            > /tmp/cooddy_r04.json 2>/tmp/cooddy_r04.err || echo "[warn] cooddy 运行非零（镜像可能未构建成功）"
          echo "=== cooddy 对 r04 输出（前 40 行）==="
          head -40 /tmp/cooddy_r04.json 2>/dev/null
          echo "=== stderr 关键 ==="
          grep -iE 'error|cwe|problem|z3' /tmp/cooddy_r04.err 2>/dev/null | head -10 || true
