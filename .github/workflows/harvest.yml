name: harvest
on:
  schedule:
    - cron: "23 3 * * *"   # 每日凌晨（错峰，避免 API 配额尖峰）
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [all, sa-scan, pr-mining]
        default: all
      repo:
        type: choice
        options: [all, curl, sqlite, redis, nginx, libuv, openssl, vim, postgres, leveldb, ninja, aetherstack]
        default: all
      since:
        type: string
        description: "历史批扫起点（YYYY-MM-DD）；留空=增量（昨天起）"
        default: ""
      max_prs:
        type: string
        description: "每仓每轮 PR 上限；历史批扫可调大（如 300）"
        default: "50"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [sa-scan, pr-mining]
        repo: ${{ fromJson(github.event.inputs.repo == 'all' && '["curl", "sqlite", "redis", "aetherstack"]' || format('["{0}"]', github.event.inputs.repo)) }}
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        if: matrix.source == 'pr-mining'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖（pr-mining）
        if: matrix.source == 'pr-mining'
        run: pip install requests pyyaml

      - name: pr-mining —— 爬 GitHub PR diff + judge + 归一化
        if: matrix.source == 'pr-mining' && (github.event.inputs.repo == 'all' || github.event.inputs.repo == matrix.repo) && (github.event.inputs.source == 'all' || github.event.inputs.source == 'pr-mining')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 增量默认=昨天；历史批扫用 dispatch --since 覆盖
          SINCE="${{ github.event.inputs.since }}"
          [ -z "$SINCE" ] && SINCE="$(date -d yesterday +%Y-%m-%d)"
          MAXPRS="${{ github.event.inputs.max_prs }}"
          [ -z "$MAXPRS" ] && MAXPRS="50"
          python3 harvest/tools/pr_mine.py \
            --config harvest/config/repos.yaml \
            --repo-name "${{ matrix.repo }}" \
            --since "$SINCE" \
            --max-prs "$MAXPRS" \
            --out /tmp/pr-findings-${{ matrix.repo }} 2>&1 | tail -5

      - name: 上传 artifact（pr-mining）
        if: matrix.source == 'pr-mining'
        uses: actions/upload-artifact@v4
        with:
          name: pr-findings-${{ matrix.repo }}
          path: /tmp/pr-findings-${{ matrix.repo }}/*.json
          if-no-files-found: ignore

      # sa-scan（design-v0.1 原路线）占位：v0.2 接入 CSA+CppCheck 扫描
      - name: sa-scan —— 占位（v0.2 接入）
        if: matrix.source == 'sa-scan'
        run: echo "[sa-scan] v0.2 接入：checkout 目标仓 + build_compdb + scan_csa/cppcheck + normalize"

  vote:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 下载全部 findings
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-findings
          pattern: "pr-findings-*"
          merge-multiple: true
      - name: 归一化 + vote + pack → inbox/draft
        run: |
          pip install requests pyyaml
          mkdir -p /tmp/norm /tmp/cands harvest/inbox/draft
          python3 harvest/tools/normalize.py --in-dir /tmp/all-findings --out /tmp/norm/all.json
          python3 harvest/tools/vote.py --findings /tmp/norm/all.json --out /tmp/cands/candidates.json --min-tools 1
          python3 harvest/tools/pack_case.py --candidates /tmp/cands/candidates.json --inbox harvest/inbox
      - name: 上传 inbox/draft 产物
        uses: actions/upload-artifact@v4
        with:
          name: inbox-draft
          path: harvest/inbox/draft
          if-no-files-found: warn

  propose:
    needs: vote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 下载 inbox/draft 产物
        uses: actions/download-artifact@v4
        with:
          name: inbox-draft
          path: harvest/inbox/draft
      - name: 评测环（轻量 SA 看候选片段能否被标出）
        run: |
          pip install requests pyyaml
          chmod +x sa/runners/run_eval_inbox.sh
          ./sa/runners/run_eval_inbox.sh "$PWD" harvest/inbox /tmp/eval-inbox
      - name: 若有新候选，开 PR 通知审核
        env:
          # 默认 GITHUB_TOKEN 无权在同仓建 PR（GitHub 防递归）；用 PAT 秘密 HARVEST_TOKEN 建 PR。
          # 未配 HARVEST_TOKEN 时回退为开 issue 通知（默认 token 允许 issues）。
          GH_TOKEN: ${{ secrets.HARVEST_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          N=$(ls -1 harvest/inbox/draft 2>/dev/null | wc -l)
          echo "待审核候选数: $N"
          if [ "$N" -eq 0 ]; then
            echo "无新候选，不开 PR"
            exit 0
          fi
          gh label create harvest --description "harvest 采集管线" --color "0e8a16" 2>/dev/null || true
          gh label create inbox --description "待审核候选" --color "fbca04" 2>/dev/null || true
          REPORT="$(cat /tmp/eval-inbox/eval_inbox_report.md)"
          BRANCH="harvest/inbox-$(date +%Y%m%d)-${{ github.run_id }}"
          git config user.name "bench-bot"
          git config user.email "harvest@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add harvest/inbox/draft
          git commit -m "harvest: 每日候选 $N 条待审核"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "$BRANCH"
          # 调试：确认实际解析到哪个 token（ghp_=classic PAT, github_pat_=fine-grained, ghu_/gho_=GITHUB_TOKEN 回退）
          echo "解析到的 token 前缀: ${GH_TOKEN:0:10}***"
          echo "HARVEST_TOKEN 是否非空: $([ -n "${{ secrets.HARVEST_TOKEN }}" ] && echo YES || echo NO)"
          # PR/issue body：附完整候选清单表 + 细粒度审核指令
          BODY=$(printf '分支 %s 含 %s 条候选草稿。\n\n## 细粒度审核指令\n在 PR 评论里回复（一行一条，空格分隔多个 id）：\n- /case accept <id1> <id2> ...  将对应候选转 cases/defect/（真 bug）\n- /case contract <id1> ...       将对应候选转 cases/contract/（确认是 FP 契约）\n- /case reject <id1> ...         将对应候选转 harvest/inbox/rejected/\n\n## 候选清单（%s 条）\n%s' "$BRANCH" "$N" "$N" "$REPORT")
          PRERR=$(mktemp)
          if gh pr create \
            --head "$BRANCH" \
            --title "harvest: 每日候选 $N 条待审核（$(date +%Y-%m-%d)）" \
            --body "$BODY" \
            --assignee "${{ github.repository_owner }}" \
            --label "harvest,inbox" 2>"$PRERR"; then
            echo "PR 已开"
          else
            echo "PR 创建失败，完整报错："
            cat "$PRERR"
            echo "（可能 HARVEST_TOKEN 缺 pull_requests:write），改开 issue 通知"
            gh issue create \
              --title "harvest: 每日候选 $N 条待审核（$(date +%Y-%m-%d)）" \
              --body "$BODY" \
              --assignee "${{ github.repository_owner }}" \
              --label "harvest,inbox" || echo "issue 也失败"
          fi
