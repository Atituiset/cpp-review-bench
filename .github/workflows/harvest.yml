name: harvest
on:
  schedule:
    - cron: "23 3 * * *"   # 每日凌晨（错峰，避免 API 配额尖峰）
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [all, sa-scan, pr-mining]
        default: all
      # 仓过滤统一用这一个文本输入（原 repo choice 是死参数：过滤只看 repos 字符串，已删）。
      # 过滤语义：逗号分隔，matrix.repo 落在该串中即运行；留空=全量。
      # 可选仓以 matrix 为准：curl, sqlite, redis, nginx, vim, postgres, linux
      repos:
        type: string
        description: "逗号分隔的仓列表（如 'curl,sqlite'），留空=全量；可选仓：curl, sqlite, redis, nginx, vim, postgres, linux"
        default: ""
      since:
        type: string
        description: "历史批扫起点（YYYY-MM-DD）；留空=增量（昨天起）"
        default: ""
      max_prs:
        type: string
        description: "每仓每轮 PR 上限；历史批扫可调大（如 1000）"
        default: "50"
      max_per_pr:
        type: string
        description: "每 PR 最多保留候选数（避免单个大 PR 刷屏），默认 3"
        default: "3"
      max_candidates:
        type: string
        description: "每仓候选总数上限（0=不限），用于历史批扫限流"
        default: "0"
      max_per_scenario:
        type: string
        description: "每 scenario 候选配额（防单一缺陷类型刷屏），默认 5"
        default: "5"
      fp_mining:
        type: boolean
        description: "开启 contract 轨误报矿（缺陷轮后加跑 fp-mining 第二轮，抓修 SA 误报的 PR）"
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: write   # upload-sarif 需要（PR 内联标注 + code-scanning）

# CI runner 默认 LANG=C（无 UTF-8）：Python 往 stderr/stdout 写中文会触发
# UnicodeEncodeError，GitHub runner 流处理将其喂进 email._policybase 递归爆栈
# （RecursionError），使步骤崩溃。统一把流编码钉成 UTF-8 根治整类问题。
env:
  PYTHONIOENCODING: utf-8
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [sa-scan, pr-mining]
        repo: [curl, sqlite, redis, nginx, vim, postgres, linux]
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python
        if: matrix.source == 'pr-mining'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 装依赖（pr-mining）
        if: matrix.source == 'pr-mining'
        run: pip install requests pyyaml

      - name: pr-mining —— 爬 GitHub PR diff + judge + 归一化
        if: >-
          matrix.source == 'pr-mining' &&
          (github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == 'pr-mining') &&
          (github.event_name == 'schedule' || github.event.inputs.repos == '' || contains(github.event.inputs.repos, matrix.repo))
        env:
          # pr-mining 的 search API（含 search/commits）需个人 PAT：GITHUB_TOKEN（Actions 自动令牌）
          # 对 search/commits 返回 total_count=0（scope/限额限制），HARVEST_TOKEN（classic PAT）才有完整搜索权限。
          GITHUB_TOKEN: ${{ secrets.HARVEST_TOKEN || secrets.GITHUB_TOKEN }}
          # dispatch 输入一律经 env 传入，绝不 ${{ }} 插值进 run（防 shell 注入）
          IN_SINCE: ${{ github.event.inputs.since }}
          IN_MAX_PRS: ${{ github.event.inputs.max_prs }}
          IN_MAX_PER_PR: ${{ github.event.inputs.max_per_pr }}
          IN_MAX_CANDIDATES: ${{ github.event.inputs.max_candidates }}
          IN_MAX_PER_SCENARIO: ${{ github.event.inputs.max_per_scenario }}
          IN_FP_MINING: ${{ github.event.inputs.fp_mining }}
        run: |
          # 增量默认=昨天；历史批扫用 dispatch --since 覆盖
          SINCE="$IN_SINCE"
          [ -z "$SINCE" ] && SINCE="$(date -d yesterday +%Y-%m-%d)"
          MAXPRS="$IN_MAX_PRS"
          [ -z "$MAXPRS" ] && MAXPRS="50"
          MAXPERPR="$IN_MAX_PER_PR"
          [ -z "$MAXPERPR" ] && MAXPERPR="3"
          MAXCAND="$IN_MAX_CANDIDATES"
          [ -z "$MAXCAND" ] && MAXCAND="0"
          MAXPSC="$IN_MAX_PER_SCENARIO"
          [ -z "$MAXPSC" ] && MAXPSC="5"
          # 白名单校验：since 为日期、其余为非负整数，不匹配直接报错退出
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::since 须为 YYYY-MM-DD：$SINCE"; exit 1; }
          for v in "$MAXPRS" "$MAXPERPR" "$MAXCAND" "$MAXPSC"; do
            [[ "$v" =~ ^[0-9]+$ ]] || { echo "::error::数值参数须为非负整数：$v"; exit 1; }
          done
          # fp-mining 仅 dispatch 显式开启（schedule 时 inputs 为空 → 关闭）
          FPFLAG=""
          [ "$IN_FP_MINING" = "true" ] && FPFLAG="--fp-mining"
          python3 harvest/tools/pr_mine.py \
            --config harvest/config/repos.yaml \
            --repo-name "${{ matrix.repo }}" \
            --since "$SINCE" \
            --max-prs "$MAXPRS" \
            --max-per-pr "$MAXPERPR" \
            --max-candidates "$MAXCAND" \
            --max-per-scenario "$MAXPSC" $FPFLAG \
            --out /tmp/pr-findings-${{ matrix.repo }} 2>&1 | tail -5

      - name: 上传 artifact（pr-mining）
        if: matrix.source == 'pr-mining'
        uses: actions/upload-artifact@v4
        with:
          name: pr-findings-${{ matrix.repo }}
          path: /tmp/pr-findings-${{ matrix.repo }}/*.json
          if-no-files-found: ignore

      # sa-scan（design-v0.1 原路线）占位：v0.2 接入 CSA+CppCheck 扫描
      - name: sa-scan —— 占位（v0.2 接入）
        if: matrix.source == 'sa-scan'
        run: echo "[sa-scan] v0.2 接入：checkout 目标仓 + build_compdb + scan_csa/cppcheck + normalize"

  vote:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 下载全部 findings
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-findings
          pattern: "pr-findings-*"
          merge-multiple: true
          if-no-files-found: ignore
      - name: 归一化 + vote + pack → inbox/draft
        run: |
          pip install requests pyyaml
          mkdir -p /tmp/norm /tmp/cands harvest/inbox/draft
          python3 harvest/tools/normalize.py --in-dir /tmp/all-findings --out /tmp/norm/all.json
          python3 harvest/tools/vote.py --findings /tmp/norm/all.json --out /tmp/cands/candidates.json --min-tools 1
          python3 harvest/tools/pack_case.py --candidates /tmp/cands/candidates.json --inbox harvest/inbox
      - name: 上传 inbox/draft 产物
        uses: actions/upload-artifact@v4
        with:
          name: inbox-draft
          path: harvest/inbox/draft
          if-no-files-found: warn

  propose:
    needs: vote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 下载 inbox/draft 产物
        uses: actions/download-artifact@v4
        with:
          name: inbox-draft
          path: harvest/inbox/draft
      - name: 评测环（轻量 SA 看候选片段能否被标出）
        run: |
          pip install requests pyyaml
          chmod +x sa/runners/run_eval_inbox.sh sa/adapters/*.py harvest/tools/*.sh
          ./sa/runners/run_eval_inbox.sh "$PWD" harvest/inbox /tmp/eval-inbox
      - name: 生成 draft SARIF（PR 内联标注）+ 四态表
        run: |
          bash harvest/tools/make_draft_sarif.sh "$PWD" harvest/inbox /tmp/draft-sarif
          echo "--- 四态表预览 ---"; cat /tmp/draft-sarif/report.md
      - name: 上传 draft SARIF 到 code-scanning（main，Security tab 可视化）
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/draft-sarif/sarif/draft.sarif
          category: harvest-draft
      - name: 若有新候选，开 PR 通知审核
        env:
          # 默认 GITHUB_TOKEN 无权在同仓建 PR（GitHub 防递归）；用 PAT 秘密 HARVEST_TOKEN 建 PR。
          # 未配 HARVEST_TOKEN 时回退为开 issue 通知（默认 token 允许 issues）。
          GH_TOKEN: ${{ secrets.HARVEST_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          N=$(ls -1 harvest/inbox/draft 2>/dev/null | wc -l)
          echo "待审核候选数: $N"
          if [ "$N" -eq 0 ]; then
            echo "无新候选，不开 PR"
            exit 0
          fi
          gh label create harvest --description "harvest 采集管线" --color "0e8a16" 2>/dev/null || true
          gh label create inbox --description "待审核候选" --color "fbca04" 2>/dev/null || true
          REPORT="$(cat /tmp/eval-inbox/eval_inbox_report.md)"
          FOUR="$(cat /tmp/draft-sarif/report.md)"
          BRANCH="harvest/inbox-$(date +%Y%m%d)-${{ github.run_id }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "bench-bot"
          git config user.email "bench-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add harvest/inbox/draft
          git commit -m "harvest: 每日候选 $N 条待审核"
          echo "BRANCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "$BRANCH"
          echo "HARVEST_TOKEN 是否非空: $([ -n "${{ secrets.HARVEST_TOKEN }}" ] && echo YES || echo NO)"
          # PR/issue body：draft 定位说明 + 每候选轻验证结论 + 候选溯源总览 + accept 检查清单 + 细粒度审核指令
          BODY=$(printf '分支 %s 含 %s 条候选草稿（来自真实已合并 fix-PR 爬取）。\n\n## 这是什么（draft 定位）\n- 本草稿**不是半成品用例**，是**线索 + 移植 blueprint**：每条候选 = 一个真实已合并 fix-PR 的可疑片段 + notes.md 里的溯源/移植要点/检查清单。\n- **accept = 承诺移植重写**：参照真实案例重写一个可编译用例；rewrite 许可的仓必须重写表达，不得直接复制切片。\n- **pr-mining**：采集工具，爬 GitHub 已合并的 fix-PR，按标题/diff 含缺陷特征（fix/leak/overflow/null/...）挑出候选 bug 片段；可能是真 bug 也可能是误报，待你审核。\n- 草稿文件见 PR 的 Files changed（harvest/inbox/draft/<id>/），含 src/ + golden.json + notes.md。\n\n## 轻验证结论（单文件 SA，file+anchor 口径）\n\n%s\n\n## 候选溯源总览\n\n%s\n\n## accept 检查清单（移植者完成后再 /case accept）\n- [ ] 编译通过（重写后的 src/ 可独立编译）\n- [ ] golden anchor 真实存在于 src/\n- [ ] 触发条件已用一句话复述（写在 notes.md「缺陷描述与触发条件」）\n- [ ] license 策略已遵守（rewrite 仓代码已重写表达）\n- [ ] `// <<< BUG ANCHOR` 标记已清除\n- [ ] notes 三段式已补全（缺陷描述 / 移植要点 / 契约安全（contract 候选））\n\n## 细粒度审核指令\n在 PR 评论里回复（一行一条，空格分隔多个 id）：\n- /case accept <id1> <id2> ...  将对应候选转 cases/defect/（真 bug）\n- /case contract <id1> ...       将对应候选转 cases/contract/（确认是 FP 契约）\n- /case reject <id1> ...         将对应候选转 harvest/inbox/rejected/\n\n注意：accept 只是预审进 cases/，merge 才落地 main；merge 前随时可 /case reject 反悔。\n\n> scenario 为候选初判（非真值），待你正式仓手动触发 LLM 评审定真值；9 工具四态在 /case accept 进 cases/ 后由 ci.yml+eval.py 产生。\n' "$BRANCH" "$N" "$REPORT" "$FOUR")
          PRERR=$(mktemp)
          if gh pr create \
            --head "$BRANCH" \
            --title "harvest: 每日候选 $N 条待审核（$(date +%Y-%m-%d)）" \
            --body "$BODY" \
            --assignee "${{ github.repository_owner }}" \
            --label "harvest,inbox" 2>"$PRERR"; then
            echo "PR 已开"
          else
            echo "PR 创建失败，完整报错："
            cat "$PRERR"
            echo "（可能 HARVEST_TOKEN 缺 pull_requests:write），改开 issue 通知"
            gh issue create \
              --title "harvest: 每日候选 $N 条待审核（$(date +%Y-%m-%d)）" \
              --body "$BODY" \
              --assignee "${{ github.repository_owner }}" \
              --label "harvest,inbox" || echo "issue 也失败"
          fi
