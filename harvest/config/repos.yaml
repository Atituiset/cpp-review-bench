# harvest 目标仓矩阵（pinned ref 钉死，可溯源）
# build: cmake / make-compiledb / bear
# scope: 路径白名单（仅扫这些前缀，降低噪声与构建成本）
repos:
  - name: curl
    url: https://github.com/curl/curl
    ref: curl-8_9_1
    build: make-compiledb
    scope: { include: ["lib/", "src/"], exclude: ["tests/", "docs/"] }
    languages: [c]
  - name: sqlite
    url: https://github.com/sqlite/sqlite
    ref: version-3.46.1
    build: make-compiledb
    scope: { include: ["src/"], exclude: ["test/", "tool/"] }
    languages: [c]
  - name: redis
    url: https://github.com/redis/redis
    ref: 7.4.0
    build: make-compiledb
    scope: { include: ["src/"], exclude: ["tests/", "deps/"] }
    languages: [c]
  - name: nginx
    url: https://github.com/nginx/nginx
    ref: release-1.27.1
    build: make-compiledb
    scope: { include: ["src/"], exclude: ["tests/"] }
    languages: [c]
  - name: libuv
    url: https://github.com/libuv/libuv
    ref: v1.48.0
    build: make-compiledb
    scope: { include: ["src/"], exclude: ["test/"] }
    languages: [c]
  - name: openssl
    url: https://github.com/openssl/openssl
    ref: openssl-3.3.1
    build: make-compiledb
    scope: { include: ["crypto/", "ssl/", "apps/"], exclude: ["test/", "doc/"] }
    languages: [c]
  - name: vim
    url: https://github.com/vim/vim
    ref: v9.1.0000
    build: make-compiledb
    scope: { include: ["src/"], exclude: ["testdir/"] }
    languages: [c]
  - name: postgres
    url: https://github.com/postgres/postgres
    ref: REL_16_3
    build: make-compiledb
    scope: { include: ["src/backend/", "src/bin/"], exclude: ["src/test/", "contrib/"] }
    languages: [c]
  - name: leveldb
    url: https://github.com/google/leveldb
    ref: 1.23
    build: cmake
    scope: { include: ["db/", "include/"], exclude: ["tests/"] }
    languages: [c, cpp]
  - name: ninja
    url: https://github.com/ninja-build/ninja
    ref: v1.12.1
    build: cmake
    scope: { include: ["src/"], exclude: ["misc/"] }
    languages: [c, cpp]
  - name: aetherstack
    url: https://github.com/<org>/aetherstack   # smoke：占位，实际地址人审填
    ref: main
    build: cmake
    scope: { include: ["src/"], exclude: ["test/"] }
    languages: [c, cpp]
  - name: linux
    url: https://github.com/torvalds/linux
    ref: v6.11
    build: make-compiledb
    scope: { include: ["kernel/", "mm/", "fs/", "net/", "ipc/", "security/"], exclude: ["tools/", "Documentation/", "arch/"] }
    languages: [c]

# pr-mining 采集源专用：爬哪些仓的 PR（GitHub search 语法）
# 默认 query 太窄（fix in:title 命中极少，curl 仅 3、sqlite/postgres/linux 0）。
# 改为更宽的缺陷信号词；单查询 OR 算子 ≤5（GitHub 限制），按仓定制。
#   - 通用 C/C++ 仓：标题含 fix/bug/leak/overflow/crash/null 之一
#   - linux 内核：社区用 fixes:/子系统风格，用 fixes/bug/leak/overflow
pr_mining:
  targets:
    - repo: curl/curl
      query: "(fix OR bug OR leak OR overflow) in:title"
    - repo: sqlite/sqlite
      query: "(fix OR bug OR leak OR overflow) in:title"
    - repo: redis/redis
      query: "(fix OR bug OR leak OR overflow) in:title"
    - repo: nginx/nginx
      query: "(fix OR bug OR leak OR crash) in:title"
    - repo: libuv/libuv
      query: "(fix OR bug OR leak OR crash) in:title"
    - repo: openssl/openssl
      query: "(fix OR bug OR leak OR overflow) in:title"
    - repo: vim/vim
      query: "(fix OR bug OR leak OR crash) in:title"
    - repo: postgres/postgres
      query: "(fix OR bug OR leak OR overflow) in:title"
    - repo: google/leveldb
      query: "(fix OR bug OR leak OR overflow) in:title"
    - repo: ninja-build/ninja
      query: "(fix OR bug OR leak OR crash) in:title"
    - repo: torvalds/linux
      query: "(fixes OR bug OR leak OR overflow) in:title"
  query: "(fix OR bug OR leak OR overflow) in:title"   # 全局兜底（无 per-repo query 时用）
  max_prs_per_run: 50            # 每仓每轮上限（历史批扫可 dispatch 覆盖调大）
  since: "2024-01-01"            # 历史批扫起点；日常增量由 harvest.yml 动态覆盖为「昨天」
